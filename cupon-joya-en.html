<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Your booking request | JOYÀ WalkMe</title>
  <link rel="stylesheet" href="assets/cupon-joya.css?v=20260825">
</head>
<body>

<div class="cj-cargando" id="cjCargando">Loading your voucher…</div>
<div class="cj-error" id="cjError" style="display:none;"></div>

<div class="cj-outer" id="cjOuter">
  <div class="cj-card">

    <div class="cj-head">
      <div class="cj-head-word" id="cjWord">JOYÀ<span id="cjSub">Cirque du Soleil · booking request</span></div>
      <div class="cj-head-site">walkmetours.com<br>cirque-du-soleil</div>
    </div>

    <div class="cj-folio-row">
      <div class="cj-folio-col">
        <div class="cj-folio-lbl" id="cjLblFolio">FILE NO.</div>
        <div class="cj-folio" id="cjFolio"></div>
      </div>
      <div class="cj-badge" id="cjBadge"></div>
    </div>

    <div class="cj-grid" id="cjGrid"></div>

    <div class="cj-money">
      <div class="cj-money-col">
        <div class="cj-total-lbl" id="cjLblTotal">ESTIMATED TOTAL</div>
        <div class="cj-total" id="cjTotal"></div>
        <div class="cj-desglose" id="cjDesglose"></div>
      </div>
      <div class="cj-qr-box"><div class="cj-qr" id="cjQr"></div></div>
    </div>

    <div class="cj-steps-wrap">
      <div class="cj-steps-title" id="cjStepsTitle">WHAT HAPPENS NEXT</div>
      <div id="cjPasos"></div>
    </div>

    <div class="cj-contact">
      <strong id="cjContactoTitle">CONTACT</strong><br>
      WhatsApp +52 56 3974 8122 · walkmetravel@gmail.com<br>
      <span id="cjNota" style="opacity:0.6;font-size:12px;"></span>
    </div>

    <div class="cj-actions">
      <button type="button" class="cj-btn cj-btn-primary" id="cjPrint"></button>
      <a class="cj-btn cj-btn-ghost" id="cjWa" href="#" target="_blank" rel="noopener"></a>
    </div>

  </div>
</div>

<script>window.CUPON_LANG = 'en';</script>
<script src="assets/qrcode.min.js?v=20260814"></script>
<script src="assets/cupon-joya.js?v=20260825"></script>
</body>
</html>
